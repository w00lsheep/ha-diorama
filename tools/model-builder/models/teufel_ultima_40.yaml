# Teufel Ultima 40 (Mk4) Standlautsprecher.
# Stoff-Frontabdeckung als Option: Schalter "Abdeckung" im Objekt-Panel, startet aus.
# Maße laut teufel.de: 25 x 106,9 x 35,2 cm (B x H x T), Standfuß integriert.
# Front von oben: Mitteltöner 165 mm (Kevlar, kupfer, Phase-Plug), Hochtöner 25 mm,
# 2x Tieftöner 165 mm (Glasfaser), Teufel-Logo unten. Hinten: 2 Bassreflexrohre, Terminal.
# Farbe Schwarz; für Weiß im Editor die Slots "Gehaeuse" und "Sockel" umfärben.
name: Teufel Ultima 40
mount: floor
segments: 28
parts:
  # --- Standfuß und Korpus -------------------------------------------------
  - name: Sockel
    shape: box
    size: [0.25, 0.015, 0.34]
    radius: 0.004
    at: [0, 0, 0]
    color: "#161617"
    finish: matte
  - name: Fuss
    shape: box
    size: [0.19, 0.012, 0.27]
    radius: 0.002
    at: [0, 0.015, 0]
    color: "#0c0c0c"
    finish: matte
  - name: Gehaeuse
    shape: box
    size: [0.23, 1.042, 0.32]
    radius: 0.012
    at: [0, 0.027, 0]
    color: "#1d1d1f"
    finish: matte
    top: true

  # --- Mitteltöner (oben) ----------------------------------------------------
  - name: Ring
    shape: cylinder
    radius: 0.092
    height: 0.006
    rot: [90, 0, 0]
    at: [0, 0.949, 0.160]
    color: "#0f0f10"
    finish: ceramic
  - name: Sicke
    shape: torus
    radius: 0.076
    tube: 0.007
    rot: [90, 0, 0]
    at: [0, 0.949, 0.166]
    color: "#1a1a1a"
    finish: matte
  - name: Mitteltoener
    shape: lathe
    profile: [[0, 0], [0.07, 0], [0.07, 0.011], [0.0, 0.003]]
    rot: [90, 0, 0]
    at: [0, 0.949, 0.160]
    color: "#c97a4f"
    finish: fabric
  - name: Phaseplug
    shape: lathe
    profile: [[0, 0], [0.013, 0], [0.013, 0.012], [0.008, 0.016], [0, 0.019]]
    rot: [90, 0, 0]
    at: [0, 0.949, 0.160]
    color: "#b8bbbe"
    finish: metal

  # --- Hochtöner -------------------------------------------------------------
  - name: Ring
    shape: cylinder
    radius: 0.05
    height: 0.008
    rot: [90, 0, 0]
    at: [0, 0.802, 0.160]
    color: "#0f0f10"
    finish: ceramic
  - name: Sicke
    shape: torus
    radius: 0.03
    tube: 0.005
    rot: [90, 0, 0]
    at: [0, 0.802, 0.168]
    color: "#1a1a1a"
    finish: matte
  - name: Hochtoener
    shape: sphere
    radius: 0.016
    dome: true
    scale: [1, 0.7, 1]
    rot: [90, 0, 0]
    at: [0, 0.802, 0.166]
    color: "#3b3c3e"
    finish: metal

  # --- Tieftöner 1 + 2 -------------------------------------------------------
  - name: Ring
    shape: cylinder
    radius: 0.092
    height: 0.006
    rot: [90, 0, 0]
    at: [0, 0.492, 0.160]
    color: "#0f0f10"
    finish: ceramic
  - name: Sicke
    shape: torus
    radius: 0.076
    tube: 0.007
    rot: [90, 0, 0]
    at: [0, 0.492, 0.166]
    color: "#1a1a1a"
    finish: matte
  - name: Tieftoener
    shape: lathe
    profile: [[0, 0], [0.07, 0], [0.07, 0.011], [0.0, 0.003]]
    rot: [90, 0, 0]
    at: [0, 0.492, 0.160]
    color: "#38393c"
    finish: fabric
  - name: Staubkappe
    shape: sphere
    radius: 0.026
    dome: true
    scale: [1, 0.4, 1]
    rot: [90, 0, 0]
    at: [0, 0.492, 0.1645]
    color: "#232426"
    finish: ceramic

  - name: Ring
    shape: cylinder
    radius: 0.092
    height: 0.006
    rot: [90, 0, 0]
    at: [0, 0.269, 0.160]
    color: "#0f0f10"
    finish: ceramic
  - name: Sicke
    shape: torus
    radius: 0.076
    tube: 0.007
    rot: [90, 0, 0]
    at: [0, 0.269, 0.166]
    color: "#1a1a1a"
    finish: matte
  - name: Tieftoener
    shape: lathe
    profile: [[0, 0], [0.07, 0], [0.07, 0.011], [0.0, 0.003]]
    rot: [90, 0, 0]
    at: [0, 0.269, 0.160]
    color: "#38393c"
    finish: fabric
  - name: Staubkappe
    shape: sphere
    radius: 0.026
    dome: true
    scale: [1, 0.4, 1]
    rot: [90, 0, 0]
    at: [0, 0.269, 0.1645]
    color: "#232426"
    finish: ceramic

  # --- Logo ------------------------------------------------------------------
  - name: Logo
    shape: box
    size: [0.05, 0.012, 0.002]
    radius: 0.001
    at: [0, 0.086, 0.1605]
    color: "#d8d8d8"
    finish: matte

  # --- Rückseite: 2 Bassreflexrohre + Anschlussterminal ----------------------
  - name: Reflexrohr
    shape: cylinder
    radius: 0.032
    height: 0.004
    rot: [-90, 0, 0]
    at: [0, 0.62, -0.160]
    color: "#0a0a0a"
    finish: matte
  - name: Reflexrohr
    shape: cylinder
    radius: 0.032
    height: 0.004
    rot: [-90, 0, 0]
    at: [0, 0.45, -0.160]
    color: "#0a0a0a"
    finish: matte
  - name: Terminal
    shape: box
    size: [0.09, 0.13, 0.006]
    radius: 0.003
    at: [0, 0.18, -0.163]
    color: "#111112"
    finish: matte

  # --- Stoff-Frontabdeckung, im Editor zuschaltbar (4-5 mm vor den Phase-Plugs) ---
  - group: Abdeckung
    option: Abdeckung off
    parts:
    - name: Abdeckung
      shape: box
      size: [0.226, 1.032, 0.02]
      radius: 0.007
      at: [0, 0.032, 0.171]
      color: '#2a2a2c'
      finish: fabric
    - name: Abdeckungslogo
      shape: box
      size: [0.05, 0.012, 0.002]
      radius: 0.001
      at: [0, 0.086, 0.1825]
      color: '#d8d8d8'
      finish: matte
